[project]
name = "afrimyth-api"
version = "1.0.0"
description = "API Django du projet Afrimyth"
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# pytest / pytest-django
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "accounts", "mythology"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# Couverture
# ---------------------------------------------------------------------------
# `--cov` n'est volontairement pas dans `addopts` : mesurer la couverture
# ralentit chaque exécution, alors que le travail courant lance des tests
# ciblés. La commande complète est documentée dans le README.

[tool.coverage.run]
# Les trois paquets applicatifs, nommés explicitement : mesurer `.` ferait
# entrer le dépôt entier dans le dénominateur.
source = ["accounts", "config", "mythology"]
# Couverture de branches, et pas seulement de lignes : un `if` dont une seule
# issue est exercée doit se voir.
branch = true
omit = [
    # Les tests ne se mesurent pas eux-mêmes.
    "*/tests/*",
    # Code généré, rejoué à chaque création de base de test : le compter
    # gonflerait la mesure sans rien garantir.
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
# Seuil fixé d'après la mesure initiale — 98,20 % de lignes et de branches
# sur les trois paquets applicatifs — avec une marge délibérée de 3,2 points.
# Elle absorbe les variations ordinaires d'un remaniement sans rendre la CI
# rouge pour du bruit, tout en arrêtant une vraie régression. Sa
# justification est dans `docs/reports/phase-6-increment-2-ci-couverture.md`.
fail_under = 95

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
